; CosmoLibre — widget face, Wi-Fi/NTP, weather, LAN web UI
[platformio]
default_envs = cosmo

[env:cosmo]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.flash_mode = dio
board_build.f_cpu = 160000000L
board_upload.flash_size = 4MB
board_build.ldscript = eagle.flash.4m.ld
; PlatformIO finds the CH340 serial port by itself; pin it if you have several:
; upload_port = COM4        (Windows)  /  /dev/ttyUSB0 (Linux)  /  /dev/cu.wchusbserial* (macOS)
; monitor_port = COM4
board_upload.resetmethod = nodemcu
extra_scripts = pre:scripts/embed_web.py
lib_deps =
  zinggjm/GxEPD2 @ ^1.5.9
  adafruit/Adafruit GFX Library @ ^1.11.11
  earlephilhower/ESP8266Audio @ ^1.9.9
  tzapu/WiFiManager @ ^2.0.17
  ricmoo/QRCode @ ^0.0.1
build_flags =
  ; Full lwIP — LOW_MEMORY often breaks SNTP/DNS
  -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
  -I include
  ; QR code on the Info screen is always version 3: drop the other tables
  -DLOCK_VERSION=3

; Power diagnostic: same firmware with Wi‑Fi switched off entirely.
;   pio run -e cosmo-nowifi -t upload
[env:cosmo-nowifi]
extends = env:cosmo
build_flags =
  ${env:cosmo.build_flags}
  -DCOSMO_NO_WIFI
